<div class="p-8">
  <h2 class="text-3xl font-bold mb-4">Documents</h2>
  <form (ngSubmit)="upload()" class="mb-6 flex flex-col md:flex-row gap-2">
    <input [(ngModel)]="ownerId" name="ownerId" placeholder="Owner ID" class="p-2 border rounded" />
    <input [(ngModel)]="ownerType" name="ownerType" placeholder="Owner Type" class="p-2 border rounded" />
    <input type="file" (change)="select($event)" class="p-2 border rounded" />
    <button type="submit" class="bg-indigo-600 text-white rounded px-4 py-2">Upload</button>
  </form>
  <ul class="list-disc pl-6">
    <li *ngFor="let d of documents">{{d.label}} ({{d.id}})</li>
  </ul>
</div>
