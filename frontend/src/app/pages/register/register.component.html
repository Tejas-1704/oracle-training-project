<div class="min-h-screen flex items-center justify-center bg-gradient-to-r from-green-500 to-teal-600">
  <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-4 text-center">Register</h2>
    <div *ngIf="message" class="text-green-600 mb-4">{{message}}</div>
    <div *ngIf="error" class="text-red-500 mb-4">{{error}}</div>
    <form (ngSubmit)="register()" class="space-y-3">
      <input [(ngModel)]="username" name="username" placeholder="Username" class="w-full p-2 border rounded" required />
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <input [(ngModel)]="firstName" name="firstName" placeholder="First Name" class="w-full p-2 border rounded" required />
        <input [(ngModel)]="lastName" name="lastName" placeholder="Last Name" class="w-full p-2 border rounded" required />
      </div>
      <input [(ngModel)]="email" name="email" type="email" placeholder="Email" class="w-full p-2 border rounded" required />
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <input [(ngModel)]="phone" name="phone" placeholder="Phone Number (optional)" class="w-full p-2 border rounded" />
        <input [(ngModel)]="dob" name="dob" type="date" placeholder="Date of Birth (YYYY-MM-DD)" class="w-full p-2 border rounded" />
      </div>
      <input [(ngModel)]="password" name="password" type="password" placeholder="Password" class="w-full p-2 border rounded" required />
      <input [(ngModel)]="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm Password" class="w-full p-2 border rounded" required />
      <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">Register</button>
    </form>
    <p class="mt-4 text-sm text-center">Already have an account? <a routerLink="/login" class="text-green-600">Login</a></p>
  </div>
</div>
